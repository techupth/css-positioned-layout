<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- Start coding here -->
  <header class="chat-header">
    <h1>Techup Chatroom</h1>
  </header>
 
  <main class="chat-body">
 
    <!-- Right side: messages sent by "me" -->
    <div class="message-row right">
      <div class="bubble green tail-right">
        สวัสดีจ้า
      </div>
    </div>
 
    <div class="message-row right">
      <!-- Gray bubble with positioned × button overlapping it -->
      <div class="bubble gray deletable">
        Coding สนุกจังเลย
        <button class="delete-btn">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
 
    <div class="message-row right">
      <div class="bubble green">
        🤩 😍
      </div>
    </div>
 
    <!-- Left side: messages received -->
    <div class="message-row left">
      <div class="bubble dark-gray">
        😍
      </div>
    </div>
 
    <div class="message-row left">
      <div class="bubble dark-gray">
        🤩
      </div>
    </div>
 
  </main>
 
</body>

</html>
