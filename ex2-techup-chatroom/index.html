<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  
  <!-- ส่วนหัว: position fixed ติดด้านบนเสมอ -->
  <header class="header">Techup Chatroom</header>
 
  <!-- พื้นที่แชท: position relative เป็นจุดอ้างอิงให้ข้อความ -->
  <main class="chat">
 
    <!-- ข้อความฝั่งขวา (ของเรา) -->
    <div class="bubble right green" style="top: 20px;">สวัสดีค่ะ</div>
 
    <div class="bubble right light" style="top: 68px;">
      Coding สนุกจังเลย
      <span class="close">×</span>
    </div>
 
    <div class="bubble right green" style="top: 112px;">🍪 😍</div>
 
    <!-- ข้อความฝั่งซ้าย (คู่สนทนา) -->
    <div class="bubble left gray" style="top: 160px;">😍</div>
    <div class="bubble left gray" style="top: 208px;">🍪</div>
 
  </main>
</body>

</html>
