<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Techup Chatroom</title>
</head>

<body>
  <div class="chatroom">
    <div class="header">Techup Chatroom</div>
    <div class="chat-list">
      <div class="chat-row right">
        <div class="chat-bubble green">สวัสดีจ้า</div>
      </div>
      <div class="chat-row right">
        <div class="chat-bubble gray">
          Coding สนุกจังเลย
          <span class="close-btn">×</span>
        </div>
      </div>
      <div class="chat-row right">
        <div class="chat-bubble green">🥳 😍</div>
      </div>
      <div class="chat-row left">
        <div class="chat-bubble">😍</div>
      </div>
      <div class="chat-row left">
        <div class="chat-bubble">🥳</div>
      </div>
    </div>
  </div>
</body>

</html>
