
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techup Chatroom</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    Techup Chatroom
  </header>

  <main class="chatroom">
    <section class="messages-right">
      <div class="message green">
        สวัสดีจ้า
        <span class="tail"></span>
      </div>

      <div class="message light-gray">
        Coding สนุกจังเลย
        <button class="close-button" type="button" aria-label="Close">x</button>
      </div>

      <div class="message green">
        😍 🥰
        <span class="tail"></span>
      </div>
    </section>

    <section class="messages-left">
      <div class="message gray">😍</div>
      <div class="message gray">🥳</div>
    </section>
  </main>
</body>
</html>
