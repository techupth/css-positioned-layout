<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kully-Qoo Bubble Tea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- กรอบสีขาวด้านนอก (position: absolute เทียบกับ body) -->
  <div class="frame">

    <!-- กล่องรูปภาพ (position: relative เป็นตัวอ้างอิงให้ลูกๆ) -->
    <div class="card">
      <img class="photo" src="./preview-img.jpeg" alt="Kully-Qoo Bubble Tea">
      <div class="overlay"></div>
      <span class="badge">ปากน้ำ</span>
      <h2 class="caption">Kully-Qoo Bubble Tea ตลาดปากน้ำ</h2>
    </div>

  </div>

</body>
</html>
